    <!-- =========================================================
         SCRIPT
    ========================================================== -->

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const welcomeScreen =
                document.getElementById("welcomeScreen");

            const mainWebsite =
                document.getElementById("mainWebsite");

            const meButton =
                document.getElementById("meButton");

            const goAwayButton =
                document.getElementById("goAwayButton");

            const audioPlayer =
                document.getElementById("audioPlayer");


            /* =====================================================
               ENTER WEBSITE
            ===================================================== */

            function enterWebsite() {

                welcomeScreen.classList.add("hide");

                mainWebsite.style.display = "flex";
                mainWebsite.style.visibility = "visible";
                mainWebsite.style.opacity = "1";

                setTimeout(function () {

                    welcomeScreen.style.display = "none";

                }, 700);


                /*
                    Start the first song from the user's click.
                    Browsers are much more likely to allow audio
                    because this function is triggered by a button.
                */

                audioPlayer.src =
                    "music/pointatmyhead.mp3";

                audioPlayer.volume = 1;

                audioPlayer.play().then(function () {

                    document.getElementById(
                        "playButton"
                    ).textContent = "❚❚";

                }).catch(function (error) {

                    console.log(
                        "Music could not autoplay:",
                        error
                    );

                });

            }


            /* =====================================================
               ME BUTTON
            ===================================================== */

            meButton.addEventListener(
                "click",
                enterWebsite
            );


            /* =====================================================
               GO AWAY BUTTON
            ===================================================== */

            goAwayButton.addEventListener(
                "click",
                enterWebsite
            );


            /* =====================================================
               MUSIC
            ===================================================== */

            const playButton =
                document.getElementById("playButton");

            const volumeButton =
                document.getElementById("volumeButton");

            const volumeSlider =
                document.getElementById("volumeSlider");

            const volumePercent =
                document.getElementById("volumePercent");

            const progressBar =
                document.getElementById("progressBar");

            const currentTime =
                document.getElementById("currentTime");

            const duration =
                document.getElementById("duration");


            /* PLAY / PAUSE */

            playButton.addEventListener(
                "click",
                function () {

                    if (audioPlayer.paused) {

                        audioPlayer.play().then(function () {

                            playButton.textContent =
                                "❚❚";

                        }).catch(function (error) {

                            console.log(
                                "Music play error:",
                                error
                            );

                        });

                    } else {

                        audioPlayer.pause();

                        playButton.textContent =
                            "▶";

                    }

                }
            );


            /* VOLUME */

            volumeSlider.addEventListener(
                "input",
                function () {

                    const volume =
                        Number(volumeSlider.value);

                    audioPlayer.volume =
                        volume;

                    volumePercent.textContent =
                        Math.round(volume * 100) + "%";

                    if (volume === 0) {

                        volumeButton.textContent =
                            "🔇";

                    } else if (volume < 0.5) {

                        volumeButton.textContent =
                            "🔉";

                    } else {

                        volumeButton.textContent =
                            "🔊";

                    }

                }
            );


            /* MUTE */

            volumeButton.addEventListener(
                "click",
                function () {

                    if (audioPlayer.volume > 0) {

                        audioPlayer.dataset.oldVolume =
                            audioPlayer.volume;

                        audioPlayer.volume = 0;

                        volumeSlider.value = 0;

                        volumePercent.textContent =
                            "0%";

                        volumeButton.textContent =
                            "🔇";

                    } else {

                        const oldVolume =
                            Number(
                                audioPlayer.dataset.oldVolume
                            ) || 1;

                        audioPlayer.volume =
                            oldVolume;

                        volumeSlider.value =
                            oldVolume;

                        volumePercent.textContent =
                            Math.round(oldVolume * 100) + "%";

                        volumeButton.textContent =
                            "🔊";

                    }

                }
            );


            /* PROGRESS */

            audioPlayer.addEventListener(
                "timeupdate",
                function () {

                    if (!audioPlayer.duration) {
                        return;
                    }

                    progressBar.value =
                        (audioPlayer.currentTime /
                        audioPlayer.duration) * 100;

                    currentTime.textContent =
                        formatTime(
                            audioPlayer.currentTime
                        );

                }
            );


            /* DURATION */

            audioPlayer.addEventListener(
                "loadedmetadata",
                function () {

                    duration.textContent =
                        formatTime(
                            audioPlayer.duration
                        );

                }
            );


            /* SEEK */

            progressBar.addEventListener(
                "input",
                function () {

                    if (!audioPlayer.duration) {
                        return;
                    }

                    audioPlayer.currentTime =
                        (progressBar.value / 100) *
                        audioPlayer.duration;

                }
            );


            /* BACK 10 */

            document.getElementById(
                "backButton"
            ).addEventListener(
                "click",
                function () {

                    audioPlayer.currentTime =
                        Math.max(
                            0,
                            audioPlayer.currentTime - 10
                        );

                }
            );


            /* FORWARD 10 */

            document.getElementById(
                "forwardButton"
            ).addEventListener(
                "click",
                function () {

                    audioPlayer.currentTime =
                        Math.min(
                            audioPlayer.duration || 0,
                            audioPlayer.currentTime + 10
                        );

                }
            );


            /* =====================================================
               SONG LIST
            ===================================================== */

            const songs = [

                "music/pointatmyhead.mp3",
                "music/NOT HERE.mp3",
                "music/123.mp3",
                "music/TOO LATE.mp3",
                "music/ALL I WANT IS YOU NOW.mp3",
                "music/stalk your socials.mp3"

            ];


            const songNames = [

                "pointatmyhead",
                "NOT HERE",
                "123",
                "TOO LATE",
                "all i want is you now",
                "stalk your socials"

            ];


            let currentSong = 0;


            /* NEXT */

            document.getElementById(
                "nextButton"
            ).addEventListener(
                "click",
                function () {

                    currentSong++;

                    if (currentSong >= songs.length) {
                        currentSong = 0;
                    }

                    changeSong();

                }
            );


            /* PREVIOUS */

            document.getElementById(
                "previousButton"
            ).addEventListener(
                "click",
                function () {

                    currentSong--;

                    if (currentSong < 0) {
                        currentSong =
                            songs.length - 1;
                    }

                    changeSong();

                }
            );


            function changeSong() {

                audioPlayer.src =
                    songs[currentSong];

                document.getElementById(
                    "songTitle"
                ).textContent =
                    songNames[currentSong];

                audioPlayer.play().then(function () {

                    playButton.textContent =
                        "❚❚";

                }).catch(function (error) {

                    console.log(
                        "Song could not play:",
                        error
                    );

                });

            }


            /* AUTO NEXT */

            audioPlayer.addEventListener(
                "ended",
                function () {

                    currentSong++;

                    if (currentSong >= songs.length) {
                        currentSong = 0;
                    }

                    changeSong();

                }
            );


            /* =====================================================
               PHONE BUTTON
            ===================================================== */

            const phoneButton =
                document.getElementById("phoneButton");

            phoneButton.addEventListener(
                "click",
                function () {

                    phoneButton.textContent =
                        "you thought 😂";

                }
            );


            /* =====================================================
               BLUE HEART
            ===================================================== */

            const blueHeart =
                document.getElementById("blueHeart");

            const exPopup =
                document.getElementById("exPopup");


            blueHeart.addEventListener(
                "click",
                function () {

                    exPopup.classList.add("show");

                    setTimeout(
                        function () {

                            exPopup.classList.remove("show");

                        },
                        800
                    );

                }
            );


            /* =====================================================
               TIME FORMAT
            ===================================================== */

            function formatTime(seconds) {

                if (
                    !seconds ||
                    isNaN(seconds)
                ) {
                    return "0:00";
                }

                const minutes =
                    Math.floor(seconds / 60);

                const secondsPart =
                    Math.floor(seconds % 60)
                    .toString()
                    .padStart(2, "0");

                return (
                    minutes +
                    ":" +
                    secondsPart
                );

            }

        });

    </script>

</body>

</html>
